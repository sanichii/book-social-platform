{% extends 'base.html' %}

{% block title %}Edit Profile — BookCircle{% endblock %}

{% block content %}
<div class="auth-box" style="max-width: 560px; border-top: 4px solid var(--copper-gold);">
    <h2 style="margin-top: 0; color: var(--espresso-dark); text-align: center;">✏️ Update Reader Profile</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <small style="color: var(--danger);">{{ field.errors|striptags }}</small>
                {% endif %}
            </div>
        {% endfor %}
        <div style="display: flex; gap: 10px; margin-top: 16px;">
            <a href="{% url 'accounts:profile' %}" class="btn btn-soft" style="flex: 1;">Cancel</a>
            <button type="submit" class="btn" style="flex: 2;">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
