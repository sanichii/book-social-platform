<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BookCircle — Classic Literary Community{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-parchment: #F3ECE1;
            --bg-paper-light: #FAF6F0;
            --card-cream: #FFFDF9;
            --espresso-dark: #2C221E;
            --espresso-mid: #3E302A;
            --leather-brown: #5A4338;
            --copper-gold: #B07D4F;
            --copper-hover: #96663B;
            --gold-soft: #E8D9C5;
            --border-parchment: #D8CBB8;
            --text-ink: #241C18;
            --text-muted: #6E5D53;
            --danger: #A63A2B;
            --shadow-book: 0 6px 20px rgba(44, 34, 30, 0.08);
            --radius-md: 10px;
            --radius-lg: 14px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-parchment);
            color: var(--text-ink);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        h1, h2, h3, h4, .serif {
            font-family: 'Merriweather', Georgia, serif;
        }

        /* Classic Library Navbar */
        .navbar {
            background: linear-gradient(180deg, var(--espresso-dark) 0%, var(--espresso-mid) 100%);
            border-bottom: 3px solid var(--copper-gold);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 14px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 16px rgba(28, 20, 17, 0.25);
        }

        .navbar .brand {
            font-family: 'Merriweather', serif;
            font-size: 23px;
            font-weight: 700;
            color: #F5E6D3;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.4px;
        }

        .navbar .brand span {
            color: var(--copper-gold);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #E6D8C7;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            padding: 7px 14px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            background-color: rgba(176, 125, 79, 0.22);
            color: #FFF6EB;
            box-shadow: inset 0 0 0 1px rgba(176, 125, 79, 0.5);
        }

        /* Layout Container */
        .main-wrapper {
            max-width: 1120px;
            margin: 30px auto;
            padding: 0 22px;
        }

        .auth-box {
            max-width: 480px;
            margin: 40px auto;
            background: var(--card-cream);
            padding: 36px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-parchment);
            box-shadow: var(--shadow-book);
        }

        /* Cards */
        .card {
            background: var(--card-cream);
            border: 1px solid var(--border-parchment);
            border-radius: var(--radius-lg);
            padding: 22px;
            box-shadow: var(--shadow-book);
            margin-bottom: 22px;
        }

        .card-espresso {
            background: linear-gradient(145deg, var(--espresso-dark) 0%, var(--espresso-mid) 100%);
            color: #F6EDE2;
            border: 1px solid #4A3830;
            border-radius: var(--radius-lg);
            padding: 22px;
            box-shadow: 0 8px 24px rgba(36, 28, 24, 0.18);
            margin-bottom: 22px;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            background-color: var(--gold-soft);
            color: var(--leather-brown);
            border: 1px solid var(--border-parchment);
        }

        .badge-copper {
            background-color: var(--copper-gold);
            color: #FFFDF9;
            border: none;
        }

        /* Forms */
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13.5px; color: var(--espresso-mid); }

        .form-input, .form-control, select, textarea, input[type="text"], input[type="email"], input[type="password"], input[type="number"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-parchment);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            background-color: #FFFDF9;
            color: var(--text-ink);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus, .form-control:focus, select:focus, textarea:focus, input:focus {
            border-color: var(--copper-gold);
            box-shadow: 0 0 0 3px rgba(176, 125, 79, 0.2);
            outline: none;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background-color: var(--copper-gold);
            color: #FFFDF9;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: var(--copper-hover);
            transform: translateY(-1px);
        }

        .btn-espresso {
            background-color: var(--espresso-dark);
            color: #F5E6D3;
            border: 1px solid var(--copper-gold);
        }

        .btn-espresso:hover {
            background-color: var(--espresso-mid);
        }

        .btn-soft {
            background-color: var(--gold-soft);
            color: var(--espresso-dark);
            border: 1px solid var(--border-parchment);
        }

        .btn-soft:hover {
            background-color: #DECAB1;
        }

        .btn-danger-outline {
            background-color: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 5px 12px;
            font-size: 12.5px;
        }

        .btn-danger-outline:hover {
            background-color: #FBECE9;
        }

        /* Avatars */
        .avatar-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: var(--leather-brown);
            color: #F5E6D3;
            font-family: 'Merriweather', serif;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            object-fit: cover;
            border: 2px solid var(--copper-gold);
            flex-shrink: 0;
        }

        /* Alerts */
        .messages { margin-bottom: 20px; }
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 500;
        }
        .alert-success { background-color: #E7EFE3; color: #2D4A22; border: 1px solid #B6CCA9; }
        .alert-error { background-color: #FBEAE8; color: #8F2418; border: 1px solid #E8B4AE; }
        .alert-info { background-color: var(--gold-soft); color: var(--espresso-dark); border: 1px solid var(--copper-gold); }

        @media (max-width: 860px) {
            .navbar { padding: 12px 16px; flex-direction: column; gap: 10px; }
            .main-wrapper { padding: 0 14px; margin: 20px auto; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="{% url 'posts:feed' %}" class="brand">🏛️ Book<span>Circle</span></a>
        <div class="nav-links">
            {% if user.is_authenticated %}
                <a href="{% url 'posts:feed' %}" class="{% if request.resolver_match.app_name == 'posts' %}active{% endif %}">Community Feed</a>
                <a href="{% url 'books:book_catalog' %}" class="{% if request.resolver_match.app_name == 'books' %}active{% endif %}">Library Catalog</a>
                <a href="{% url 'interactions:readers_list' %}" class="{% if request.resolver_match.app_name == 'interactions' %}active{% endif %}">Members</a>
                <a href="{% url 'accounts:profile' %}" class="{% if request.resolver_match.app_name == 'accounts' %}active{% endif %}">My Shelves & Profile</a>
                <a href="{% url 'accounts:logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'accounts:login' %}">Sign In</a>
                <a href="{% url 'accounts:register' %}">Join Library</a>
            {% endif %}
        </div>
    </nav>

    <div class="main-wrapper">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
